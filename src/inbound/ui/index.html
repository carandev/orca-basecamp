<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basecamp: Start from item</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #5b6573; --border: #d6dbe2; --accent: #2f6fed; --danger: #c62828; --ok: #1b7f3b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171b; --panel: #1d2127; --text: #e6e9ee; --muted: #9aa5b3; --border: #343b45; --accent: #5b8def; --danger: #ef7a7a; --ok: #5fcf85; } }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 8px 0; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); flex: 1 1 160px; }
  input, select, button { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.on { border-color: var(--accent); font-weight: 600; }
  .banner { border: 1px solid var(--border); border-left-width: 4px; background: var(--panel); padding: 8px 12px; border-radius: 6px; margin: 8px 0; white-space: pre-wrap; word-break: break-word; }
  .banner.error { border-left-color: var(--danger); } .banner.ok { border-left-color: var(--ok); } .banner.info { border-left-color: var(--accent); }
  .item { display: flex; gap: 8px; align-items: center; justify-content: space-between; border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 8px; margin-top: 6px; }
  .item span.meta { color: var(--muted); font-size: 12px; display: block; }
  .check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px; flex: 0 0 auto; }
  .grid { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(160px, 2fr); gap: 6px 12px; align-items: center; margin: 8px 0; }
  .grid .fixed { color: var(--muted); }
  .cell { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  .col { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--border); border-radius: 6px; padding: 2px 4px 2px 8px; background: var(--panel); }
  .col button { padding: 0 6px; line-height: 1.2; }
</style>
</head>
<body>
<main>
  <h1 id="title">Basecamp: Start from item</h1>
  <div id="notice"></div>
  <div class="row">
    <button type="button" id="tab-todo" class="on">To-dos</button>
    <button type="button" id="tab-card">Cards</button>
    <button type="button" id="tab-sync">Sync</button>
    <label id="project-wrap" hidden>Project (cards)<select id="project"></select></label>
  </div>
  <div id="picker">
    <div class="row">
      <label id="repo-wrap">Repository (required)<select id="repo"></select></label>
      <label id="agent-wrap">Agent (optional)<input type="text" id="agent" placeholder="claude" spellcheck="false" maxlength="40"></label>
      <label class="check"><input type="checkbox" id="mine" checked> Only mine</label>
    </div>
    <div id="list"></div>
  </div>
  <div id="sync" hidden>
    <div class="row">
      <label class="check"><input type="checkbox" id="sync-enabled"> Sync statuses between Orca and Basecamp</label>
      <label>When both sides changed
        <select id="sync-rule">
          <option value="orca-wins">Orca wins</option>
          <option value="basecamp-wins">Basecamp wins</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Project (card columns)<select id="sync-project"></select></label>
    </div>
    <div id="sync-grid" class="grid"></div>
    <div class="row">
      <label>Custom Orca status<input type="text" id="sync-custom" placeholder="my-status" spellcheck="false" maxlength="40"></label>
      <button type="button" id="sync-add">Add status</button>
    </div>
    <div class="row"><button type="button" id="sync-save" class="on">Save</button></div>
  </div>
</main>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  // Link mode: the target worktree lives only in the server-side session; the page sends the session, never a worktree.
  var session = params.get('session') || '';
  var linkMode = params.get('mode') === 'link' && session !== '';
  var linkName = '';
  var $ = function (id) { return document.getElementById(id); };
  var kind = 'todo';
  var BASE_STATUSES = ['todo', 'in-progress', 'in-review'];
  var cfg = null;          // the whole sync config, merged with edits as they are made
  var gridProject = '';    // project whose grid is on screen
  var gridStatuses = [];   // Orca statuses shown in the grid, in order
  var gridDraft = {};      // {status: [columnId, ...]} being edited for gridProject
  var gridColumns = [];    // mappable columns of gridProject
  var projects = [];       // Basecamp projects, as served by /api/projects

  function say(cls, text) {
    var box = $('notice');
    box.textContent = '';
    if (!text) return;
    var d = document.createElement('div');
    d.className = 'banner ' + cls;
    d.textContent = text;
    box.appendChild(d);
  }
  function api(method, path, body) {
    var opts = { method: method, headers: { 'X-Token': token } };
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status }; });
    });
  }
  function problem(j) { return (j.error || 'Request failed') + (j.hint ? '\nHint: ' + j.hint : ''); }
  function fill(select, rows) {
    select.textContent = '';
    rows.forEach(function (r) {
      var o = document.createElement('option');
      o.value = String(r.id);
      o.textContent = r.name || String(r.id);
      select.appendChild(o);
    });
  }

  function start(item, button) {
    var repoId = $('repo').value;
    if (!repoId) return say('error', 'Choose a repository first.');
    var body = { type: item.type, id: item.id, projectId: item.projectId, repoId: repoId };
    var agent = $('agent').value.trim();
    if (agent) body.agent = agent;
    button.disabled = true;
    api('POST', '/api/start', body).then(function (j) {
      button.disabled = false;
      if (!j.ok) return say('error', problem(j));
      say(j.status === 'linked' ? 'ok' : 'info', j.status === 'linked' ? 'Created ' + j.name + ' and linked it.' : 'Created ' + j.name + ' but could not link it.');
    }, function (e) { button.disabled = false; say('error', e.message); });
  }

  function link(item, button) {
    button.disabled = true;
    api('POST', '/api/link', { type: item.type, id: item.id, projectId: item.projectId, session: session }).then(function (j) {
      if (!j.ok) { button.disabled = false; return say('error', problem(j)); }
      // The session is single-use: the list is no longer actionable.
      $('list').textContent = '';
      say('ok', 'Linked ' + j.title + ' to ' + linkName + '. You can close this tab.');
    }, function (e) { button.disabled = false; say('error', e.message); });
  }

  function render(items) {
    var list = $('list');
    list.textContent = '';
    if (items.length === 0) list.textContent = 'Nothing to show.';
    items.forEach(function (item) {
      var title = document.createElement('div');
      title.textContent = item.title;
      var meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = item.projectName;
      title.appendChild(meta);
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = linkMode ? 'Link' : 'Start';
      button.addEventListener('click', function () { (linkMode ? link : start)(item, button); });
      var row = document.createElement('div');
      row.className = 'item';
      row.appendChild(title);
      row.appendChild(button);
      list.appendChild(row);
    });
  }

  // ---- Sync tab: every value from the server is shown with textContent only.
  function mappingOf(projectId) {
    var all = cfg.statusToColumn;
    return Object.prototype.hasOwnProperty.call(all, projectId) ? all[projectId] : {};
  }

  /** Writes the draft of the project on screen into cfg, in grid order; statuses with no column are omitted. */
  function commitGrid() {
    if (!cfg || !gridProject) return;
    var map = {};
    gridStatuses.forEach(function (status) {
      if (gridDraft[status] && gridDraft[status].length > 0) map[status] = gridDraft[status].slice();
    });
    cfg.statusToColumn[gridProject] = map;
  }

  function columnTitle(id) {
    for (var i = 0; i < gridColumns.length; i++) if (gridColumns[i].id === id) return gridColumns[i].name;
    return 'Column ' + id + ' (not found)';
  }

  function columnItem(status, id, index) {
    var item = document.createElement('span');
    item.className = 'col';
    item.textContent = columnTitle(id) + (index === 0 ? ' (destination)' : '');
    var remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '×';
    remove.title = 'Remove column';
    remove.addEventListener('click', function () {
      gridDraft[status].splice(index, 1);
      renderGrid();
    });
    item.appendChild(remove);
    return item;
  }

  function addSelect(status) {
    var select = document.createElement('select');
    var none = document.createElement('option');
    none.value = '';
    none.textContent = gridDraft[status].length === 0 ? 'none' : 'add column';
    select.appendChild(none);
    gridColumns.forEach(function (c) {
      if (gridDraft[status].indexOf(c.id) >= 0) return;
      var o = document.createElement('option');
      o.value = c.id;
      o.textContent = c.name;
      select.appendChild(o);
    });
    select.addEventListener('change', function () {
      if (!select.value) return;
      gridDraft[status].push(select.value);
      renderGrid();
    });
    return select;
  }

  function renderGrid() {
    var grid = $('sync-grid');
    grid.textContent = '';
    if (!gridProject) return;
    gridStatuses.forEach(function (status) {
      if (!gridDraft[status]) gridDraft[status] = [];
      var name = document.createElement('div');
      name.textContent = status;
      var cell = document.createElement('div');
      cell.className = 'cell';
      gridDraft[status].forEach(function (id, i) { cell.appendChild(columnItem(status, id, i)); });
      cell.appendChild(addSelect(status));
      grid.appendChild(name);
      grid.appendChild(cell);
    });
    var done = document.createElement('div');
    done.textContent = 'completed';
    var fixed = document.createElement('div');
    fixed.className = 'fixed';
    fixed.textContent = 'Done (fixed)';
    grid.appendChild(done);
    grid.appendChild(fixed);
  }

  function loadGrid() {
    commitGrid();
    gridProject = $('sync-project').value;
    gridColumns = [];
    gridDraft = {};
    if (!gridProject) return renderGrid();
    var custom = Object.keys(mappingOf(gridProject)).filter(function (s) { return BASE_STATUSES.indexOf(s) < 0; });
    gridStatuses = BASE_STATUSES.concat(custom);
    var saved = mappingOf(gridProject);
    gridStatuses.forEach(function (st) { gridDraft[st] = Object.prototype.hasOwnProperty.call(saved, st) ? saved[st].slice() : []; });
    renderGrid();
    var asked = gridProject;
    api('GET', '/api/columns?projectId=' + encodeURIComponent(asked)).then(function (j) {
      if (asked !== gridProject) return;
      if (!j.ok) return say('error', problem(j));
      commitGrid();
      gridColumns = j.columns.filter(function (c) { return c.mappable; });
      renderGrid();
    }, function (e) { say('error', 'Could not reach the picker server: ' + e.message); });
  }

  function saveSync() {
    commitGrid();
    cfg.enabled = $('sync-enabled').checked;
    cfg.conflictRule = $('sync-rule').value;
    var button = $('sync-save');
    button.disabled = true;
    api('POST', '/api/sync-config', cfg).then(function (j) {
      button.disabled = false;
      if (!j.ok) return say('error', problem(j));
      cfg = j.config;
      say('ok', 'Sync settings saved.');
    }, function (e) { button.disabled = false; say('error', e.message); });
  }

  function addStatus() {
    var status = $('sync-custom').value.trim();
    if (!gridProject) return say('error', 'Choose a project first.');
    if (!/^[A-Za-z0-9][\w.-]{0,39}$/.test(status) || status === 'completed') {
      return say('error', 'Use letters, digits, dot, dash or underscore (not "completed").');
    }
    if (gridStatuses.indexOf(status) >= 0) return say('error', status + ' is already in the grid.');
    commitGrid();
    gridStatuses.push(status);
    $('sync-custom').value = '';
    say('', '');
    renderGrid();
  }

  function loadSync() {
    api('GET', '/api/sync-config').then(function (j) {
      if (!j.ok) return say('error', problem(j));
      cfg = j.config;
      $('sync-enabled').checked = cfg.enabled;
      $('sync-rule').value = cfg.conflictRule;
      gridProject = '';
      fill($('sync-project'), projects);
      loadGrid();
    }, function (e) { say('error', 'Could not reach the picker server: ' + e.message); });
  }

  function load() {
    $('tab-todo').className = kind === 'todo' ? 'on' : '';
    $('tab-card').className = kind === 'card' ? 'on' : '';
    $('tab-sync').className = kind === 'sync' ? 'on' : '';
    $('project-wrap').hidden = kind !== 'card' || $('mine').checked;
    $('sync').hidden = kind !== 'sync';
    $('picker').hidden = kind === 'sync';
    $('list').textContent = '';
    say('', '');
    if (kind === 'sync') return loadSync();
    var path = '/api/items?kind=' + kind + '&mine=' + ($('mine').checked ? '1' : '0');
    if (kind === 'card' && !$('mine').checked) {
      if (!$('project').value) return say('info', 'Choose a project.');
      path += '&projectId=' + encodeURIComponent($('project').value);
    }
    api('GET', path).then(function (j) {
      if (!j.ok) return say('error', problem(j));
      if (j.notice) say('info', j.notice);
      render(j.items);
    }, function (e) { say('error', 'Could not reach the picker server: ' + e.message); });
  }

  $('tab-todo').addEventListener('click', function () { kind = 'todo'; load(); });
  $('tab-card').addEventListener('click', function () { kind = 'card'; load(); });
  $('tab-sync').addEventListener('click', function () { kind = 'sync'; load(); });
  $('project').addEventListener('change', load);
  $('mine').addEventListener('change', load);
  $('sync-project').addEventListener('change', loadGrid);
  $('sync-add').addEventListener('click', addStatus);
  $('sync-save').addEventListener('click', saveSync);

  if (linkMode) {
    $('repo-wrap').hidden = true;
    $('agent-wrap').hidden = true;
    $('tab-sync').hidden = true;
    $('title').textContent = 'Link to: ';
    api('GET', '/api/link-session?session=' + encodeURIComponent(session)).then(function (j) {
      if (!j.ok) { $('picker').hidden = true; return say('error', problem(j) + '\nRun "Basecamp: Link item to this worktree" again.'); }
      linkName = j.displayName;
      $('title').textContent = 'Link to: ' + linkName;
    }, function (e) { say('error', 'Could not reach the picker server: ' + e.message); });
  } else {
    api('GET', '/api/repos').then(function (j) {
      if (!j.ok) return say('error', problem(j));
      fill($('repo'), j.repos);
    });
  }
  api('GET', '/api/projects').then(function (j) {
    if (!j.ok) return;
    projects = j.projects;
    fill($('project'), projects);
  });
  load();
})();
</script>
</body>
</html>
